[package]
name = "k11d"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "k11 userspace daemon — reads eBPF events and builds process trees"

[dependencies]
k11-common = { path = "../k11-common", features = ["user"] }
k11-proto = { path = "../k11-proto" }
aya = "0.13.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tonic = "0.12"
tonic-web = "0.12"
prost = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
dns-lookup = "2"
maxminddb = "0.24"

[build-dependencies]
