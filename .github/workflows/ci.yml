name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The daemon and its tests build on stable; only the probe needs
      # nightly (build-std), selected by k11-probe/rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, rustfmt
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            k11-probe

      # Prebuilt, as upstream recommends: building it needs a system LLVM.
      - name: Install bpf-linker
        run: |
          curl -sSfL https://github.com/aya-rs/bpf-linker/releases/download/v0.13.0/bpf-linker-x86_64-unknown-linux-musl.tar.zst \
            | tar --zstd -xf - -C ~/.cargo/bin
          bpf-linker --version

      - name: Format
        run: |
          cargo fmt --all --check
          cd k11-probe && cargo fmt --check

      - name: Build probe
        run: cd k11-probe && cargo build --release --target bpfel-unknown-none -Z build-std=core

      - name: Build dashboard
        run: cd k11-web && npm ci && npm run build

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Static, with probe and dashboard embedded: the release artifact.
      - name: Release build
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --release -p k11d --target x86_64-unknown-linux-musl

      - uses: actions/upload-artifact@v4
        with:
          name: k11-x86_64-linux
          path: target/x86_64-unknown-linux-musl/release/k11

  # A tag v* publishes the static binary built above.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: k11-x86_64-linux
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          install -m 755 k11 k11-x86_64-linux
          gh release create "$GITHUB_REF_NAME" k11-x86_64-linux \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  # The probe on a real kernel: the runner's own, booted under KVM, without
  # and with the BPF LSM (Ubuntu builds it in but leaves it off).
  vm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            k11-probe
      # Prebuilt, as upstream recommends: building it needs a system LLVM.
      - name: Install bpf-linker
        run: |
          curl -sSfL https://github.com/aya-rs/bpf-linker/releases/download/v0.13.0/bpf-linker-x86_64-unknown-linux-musl.tar.zst \
            | tar --zstd -xf - -C ~/.cargo/bin
          bpf-linker --version
      - name: Tools and KVM
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-system-x86
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo install -m 644 /boot/vmlinuz-$(uname -r) vmlinuz
          cd k11-web && npm ci
      - run: cargo xtask vm --kernel vmlinuz --smoke
      - run: cargo xtask vm --kernel vmlinuz --append "lsm=lockdown,capability,landlock,yama,apparmor,bpf"
