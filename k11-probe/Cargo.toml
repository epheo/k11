[package]
name = "k11-probe"
version = "0.3.2"
edition = "2021"
license = "MIT OR GPL-2.0-only"
description = "eBPF probes for k11 kernel security monitoring"

# Standalone workspace — k11-probe builds with bpfel-unknown-none target
# and cannot be a member of the host workspace.
[workspace]

[dependencies]
aya-ebpf = "0.1.1"
k11-common = { path = "../k11-common", default-features = false }

[[bin]]
name = "k11-ebpf"
path = "src/main.rs"

