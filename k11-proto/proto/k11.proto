syntax = "proto3";
package k11;

// ---------------------------------------------------------------------------
// Service
// ---------------------------------------------------------------------------

service K11 {
  rpc GetAgents(GetAgentsRequest)             returns (GetAgentsResponse);
  rpc GetAgentDetail(GetAgentDetailRequest)   returns (GetAgentDetailResponse);
  rpc GetAgentEvents(GetAgentEventsRequest)   returns (GetAgentEventsResponse);
  rpc StreamEvents(StreamEventsRequest)       returns (stream Event);
  rpc GetPolicy(GetPolicyRequest)             returns (PolicySnapshot);
  rpc UpdateDenyRules(UpdateDenyRulesRequest) returns (PolicySnapshot);
  rpc SetEnforce(SetEnforceRequest)           returns (PolicySnapshot);
}

// ---------------------------------------------------------------------------
// Agent queries
// ---------------------------------------------------------------------------

message GetAgentsRequest {
  // The store's version the client already has; agents are left out when
  // nothing changed since, so polling a quiet store costs nothing.
  uint64 if_version_ne = 1;
}

message GetAgentsResponse {
  // Changes whenever any agent does, or one is evicted.
  uint64                version = 1;
  // Most recently active first. Empty when `version` equals the request's.
  repeated AgentSummary agents  = 2;
}

message GetAgentDetailRequest {
  uint32 root_pid      = 1;
  // The tree version the client already has: only processes and
  // aggregates updated after it are sent. 0 for everything.
  uint64 since_version = 2;
}

message GetAgentDetailResponse {
  uint64      version = 1;
  // Absent when nothing changed since `since_version`.
  AgentDetail detail  = 2;
}

message GetAgentEventsRequest {
  uint32 root_pid = 1;
  // The newest `limit` events, oldest first; 0 for all the store holds.
  uint32 limit    = 2;
}

message GetAgentEventsResponse {
  repeated Event events = 1;
}

// ---------------------------------------------------------------------------
// Event streaming
// ---------------------------------------------------------------------------

message StreamEventsRequest {
  optional uint32 root_pid = 1;
}

// ---------------------------------------------------------------------------
// Events: meta on the wrapper (every event is agent-attributable), payload
// carries only syscall-specific fields. Classification (failure, sensitive
// paths, external addresses) and the human summary are computed once here
// so no client reimplements them.
// ---------------------------------------------------------------------------

message Event {
  // Increases by one per event the daemon decodes; a client merging a
  // snapshot with the stream drops what it already has.
  uint64 seq          = 11;
  uint64 timestamp_ns = 1;
  // Acting process (for fork: the parent).
  uint32 pid      = 2;
  // Root of the agent tree this event belongs to.
  uint32 root_pid = 3;
  uint32 uid      = 4;
  string comm     = 5;
  // Syscall result: fd or 0 on success, negative errno on failure.
  int32  ret       = 6;
  // errno name when the syscall failed; empty otherwise (EINPROGRESS is
  // not a failure).
  string error     = 7;
  // One line for people, e.g. "node open /etc/hosts: ENOENT".
  string summary   = 8;
  // Names a credential or secret path.
  bool   sensitive = 9;
  // A connect leaving this machine's networks, or a bind others can reach.
  bool   external  = 10;
  oneof payload {
    ExecveEvent      execve       = 20;
    OpenEvent        open         = 21;
    ConnectEvent     connect      = 22;
    ForkEvent        fork         = 23;
    UnixConnectEvent unix_connect = 24;
    ExitEvent        exit         = 25;
    BindEvent        bind         = 26;
    ListenEvent      listen       = 27;
    UnlinkEvent      unlink       = 28;
    RenameEvent      rename       = 29;
    ChmodEvent       chmod        = 30;
    ChownEvent       chown        = 31;
    SymlinkEvent     symlink      = 32;
    PtraceEvent      ptrace       = 33;
  }
}

// What the deny rules said about an open.
enum PolicyOutcome {
  ALLOWED = 0;
  // A rule matched in audit mode; the open went ahead.
  AUDITED = 1;
  // A rule matched while enforcing; the open failed with EPERM.
  DENIED  = 2;
}

message ExecveEvent {
  string filename = 1;
}

message OpenEvent {
  string        filename = 1;
  int32         flags    = 2;
  PolicyOutcome policy   = 3;
}

message ConnectEvent {
  // IPv4 or IPv6 address, no brackets.
  string addr = 1;
  uint32 port = 2;
}

message ForkEvent {
  uint32 child_pid = 1;
}

message UnixConnectEvent {
  string path = 1;
}

message ExitEvent {}

message BindEvent {
  string addr = 1;
  uint32 port = 2;
}

message ListenEvent {
  int32 backlog = 1;
}

message UnlinkEvent {
  string filename = 1;
  int32  flags    = 2;
}

message RenameEvent {
  string old_path = 1;
  string new_path = 2;
}

message ChmodEvent {
  string filename = 1;
  uint32 mode     = 2;
}

message ChownEvent {
  string filename  = 1;
  uint32 owner_uid = 2;
  uint32 owner_gid = 3;
}

message SymlinkEvent {
  string target   = 1;
  string linkpath = 2;
}

message PtraceEvent {
  uint32 request    = 1;
  uint32 target_pid = 2;
}

// ---------------------------------------------------------------------------
// Agent state
// ---------------------------------------------------------------------------

message AgentSummary {
  uint32 root_pid             = 1;
  string root_comm            = 2;
  uint32 process_count        = 3;
  uint32 running_count        = 4;
  uint64 first_seen_ms        = 5;
  uint32 file_count           = 6;
  uint32 net_count            = 7;
  uint32 unix_count           = 8;
  uint32 exec_count           = 9;
  uint32 deny_count           = 10;
  uint32 audit_count          = 11;
  uint32 fs_mod_count         = 12;
  uint32 bind_count           = 13;
  uint32 ptrace_count         = 14;
  bool   has_sensitive_files  = 15;
  bool   has_sensitive_writes = 16;
  bool   has_sensitive_delete = 17;
  bool   has_external_net     = 18;
  bool   has_listener         = 19;
  bool   has_ptrace           = 20;
  // Events discarded from this agent's in-memory ring.
  uint64 events_dropped       = 21;
  uint64 last_seen_ms         = 22;
  // Paths or addresses no longer tracked: the aggregate cap was reached.
  bool   aggregates_capped    = 23;
  // "high", "medium" or "low", and what made it so.
  string          risk         = 24;
  repeated string risk_reasons = 25;
}

message ProcessInfo {
  uint32          pid           = 1;
  string          comm          = 2;
  optional uint32 parent_pid    = 3;
  bool            running       = 4;
  uint32          file_count    = 5;
  uint32          net_count     = 6;
  uint32          unix_count    = 7;
  uint32          exec_count    = 8;
  uint64          first_seen_ms = 9;
  uint64          last_seen_ms  = 10;
}

// What every aggregate records about its accesses.
message Access {
  uint32              count         = 1;
  // Per-errno failure counts, e.g. {"ENOENT": 3}.
  map<string, uint32> errors        = 2;
  repeated string     comms         = 3;
  uint64              first_seen_ms = 4;
  uint64              last_seen_ms  = 5;
}

message FileAccess {
  string path          = 1;
  Access access        = 2;
  bool   sensitive     = 3;
  bool   modified      = 4;
  bool   deleted       = 5;
  bool   renamed       = 6;
  bool   perm_changed  = 7;
  bool   owner_changed = 8;
  bool   is_symlink    = 9;
  bool   denied        = 10;
  bool   audited       = 11;
}

message ConnectionAccess {
  string          addr     = 1;
  uint32          port     = 2;
  Access          access   = 3;
  bool            external = 4;
  optional string hostname = 5;
  optional string country  = 6;
  optional string city     = 7;
  optional string asn      = 8;
}

message UnixSocketAccess {
  string path   = 1;
  Access access = 2;
}

// Entries are keyed (pid, path, addr and port): a delta replaces what the
// client holds under the same key. Nothing is ever removed from a live tree.
message AgentDetail {
  AgentSummary              summary      = 1;
  repeated ProcessInfo      processes    = 2;
  repeated FileAccess       files        = 3;
  repeated ConnectionAccess connections  = 4;
  repeated ConnectionAccess binds        = 5;
  repeated UnixSocketAccess unix_sockets = 6;
}

// ---------------------------------------------------------------------------
// Policy
// ---------------------------------------------------------------------------

message PolicySnapshot {
  bool            enforce         = 1;
  repeated string deny_file_paths = 2;
  // Why deny rules and enforcement cannot be changed here; empty when they can.
  string          unavailable     = 3;
  // The request carried the daemon's control token: changes are accepted.
  bool            writable        = 4;
}

message GetPolicyRequest {}

message UpdateDenyRulesRequest {
  repeated string add_deny_file_paths    = 1;
  repeated string remove_deny_file_paths = 2;
}

message SetEnforceRequest {
  bool enforce = 1;
}
