syntax = "proto3";
package k11;

// ---------------------------------------------------------------------------
// Service
// ---------------------------------------------------------------------------

service K11 {
  rpc GetAgents(GetAgentsRequest)             returns (GetAgentsResponse);
  rpc GetAgentDetail(GetAgentDetailRequest)   returns (GetAgentDetailResponse);
  rpc GetAgentEvents(GetAgentEventsRequest)   returns (GetAgentEventsResponse);
  rpc StreamEvents(StreamEventsRequest)       returns (stream StreamEventsResponse);
  rpc GetPolicy(GetPolicyRequest)             returns (PolicySnapshot);
  rpc UpdateDenyRules(UpdateDenyRulesRequest) returns (PolicySnapshot);
  rpc SetEnforce(SetEnforceRequest)           returns (PolicySnapshot);
}

// ---------------------------------------------------------------------------
// Agent queries
// ---------------------------------------------------------------------------

message GetAgentsRequest {}

message GetAgentsResponse {
  repeated AgentSummary agents = 1;
}

message GetAgentDetailRequest {
  uint32 root_pid = 1;
  // Detail is omitted from the response when the tree's version still
  // equals this, so a polling client pays nothing for a quiet agent.
  uint64 if_version_ne = 2;
}

message GetAgentDetailResponse {
  uint64      version = 1;
  AgentDetail detail  = 2;
}

message GetAgentEventsRequest {
  uint32 root_pid = 1;
  uint32 offset   = 2;
  uint32 limit    = 3;
}

message GetAgentEventsResponse {
  repeated Event events = 1;
  uint32         total  = 2;
}

// ---------------------------------------------------------------------------
// Event streaming
// ---------------------------------------------------------------------------

enum EventFormat {
  K11_NATIVE = 0;
  OCSF       = 1;
}

message StreamEventsRequest {
  optional uint32 root_pid = 1;
  EventFormat     format   = 2;
}

message StreamEventsResponse {
  oneof payload {
    Event  event     = 1;
    string ocsf_json = 2;
  }
}

// ---------------------------------------------------------------------------
// Events: meta on the wrapper (every event is agent-attributable), payload
// carries only syscall-specific fields. Classification (sensitive paths,
// external addresses) is computed once here so no client reimplements it.
// ---------------------------------------------------------------------------

message Event {
  uint64 timestamp_ns = 1;
  // Acting process (for fork: the parent).
  uint32 pid      = 2;
  // Root of the agent tree this event belongs to.
  uint32 root_pid = 3;
  uint32 uid      = 4;
  string comm     = 5;
  oneof payload {
    ExecveEvent      execve       = 10;
    OpenatEvent      openat       = 11;
    ConnectEvent     connect      = 12;
    ForkEvent        fork         = 13;
    UnixConnectEvent unix_connect = 14;
    ExitEvent        exit         = 15;
    BindEvent        bind         = 16;
    ListenEvent      listen       = 17;
    UnlinkEvent      unlink       = 18;
    RenameEvent      rename       = 19;
    ChmodEvent       chmod        = 20;
    ChownEvent       chown        = 21;
    SymlinkEvent     symlink      = 22;
    PtraceEvent      ptrace       = 23;
  }
}

// What the deny rules said about an open.
enum PolicyOutcome {
  ALLOWED = 0;
  // A rule matched in audit mode; the open went ahead.
  AUDITED = 1;
  // A rule matched while enforcing; the open failed with EPERM.
  DENIED  = 2;
}

message ExecveEvent {
  string filename  = 1;
  bool   sensitive = 2;
}

message OpenatEvent {
  string        filename  = 1;
  int32         flags     = 2;
  int32         ret       = 3;
  PolicyOutcome policy    = 4;
  bool          sensitive = 5;
}

message ConnectEvent {
  string addr     = 1;
  uint32 port     = 2;
  int32  ret      = 3;
  bool   external = 4;
}

message ForkEvent {
  uint32 child_pid = 1;
}

message UnixConnectEvent {
  string path = 1;
  int32  ret  = 2;
}

message ExitEvent {}

message BindEvent {
  string addr     = 1;
  uint32 port     = 2;
  int32  ret      = 3;
  bool   external = 4;
}

message ListenEvent {
  int32 backlog = 1;
  int32 ret     = 2;
}

message UnlinkEvent {
  string filename  = 1;
  int32  flags     = 2;
  int32  ret       = 3;
  bool   sensitive = 4;
}

message RenameEvent {
  string old_path  = 1;
  string new_path  = 2;
  int32  ret       = 3;
  bool   sensitive = 4;
}

message ChmodEvent {
  string filename  = 1;
  uint32 mode      = 2;
  int32  ret       = 3;
  bool   sensitive = 4;
}

message ChownEvent {
  string filename  = 1;
  uint32 owner_uid = 2;
  uint32 owner_gid = 3;
  int32  ret       = 4;
  bool   sensitive = 5;
}

message SymlinkEvent {
  string target    = 1;
  string linkpath  = 2;
  int32  ret       = 3;
  bool   sensitive = 4;
}

message PtraceEvent {
  uint32 request    = 1;
  uint32 target_pid = 2;
  int32  ret        = 3;
}

// ---------------------------------------------------------------------------
// Agent state
// ---------------------------------------------------------------------------

message AgentSummary {
  uint32 root_pid             = 1;
  string root_comm            = 2;
  uint32 process_count        = 3;
  uint32 running_count        = 4;
  uint32 exited_count         = 5;
  uint32 file_count           = 6;
  uint32 net_count            = 7;
  uint32 unix_count           = 8;
  uint32 exec_count           = 9;
  uint32 deny_count           = 10;
  uint32 audit_count          = 11;
  uint32 fs_mod_count         = 12;
  uint32 bind_count           = 13;
  uint32 ptrace_count         = 14;
  bool   has_sensitive_files  = 15;
  bool   has_sensitive_writes = 16;
  bool   has_sensitive_delete = 17;
  bool   has_external_net     = 18;
  bool   has_listener         = 19;
  bool   has_ptrace           = 20;
  // Events discarded from this agent's in-memory ring.
  uint64 events_dropped       = 21;
}

message ProcessInfo {
  uint32          pid           = 1;
  string          comm          = 2;
  optional uint32 parent_pid    = 3;
  bool            running       = 4;
  uint32          file_count    = 5;
  uint32          net_count     = 6;
  uint32          unix_count    = 7;
  uint32          exec_count    = 8;
  uint64          first_seen_ms = 9;
  uint64          last_seen_ms  = 10;
}

// What every aggregate records about its accesses.
message Access {
  uint32              count         = 1;
  // Per-errno failure counts, e.g. {"ENOENT": 3}.
  map<string, uint32> errors        = 2;
  repeated string     comms         = 3;
  uint64              first_seen_ms = 4;
  uint64              last_seen_ms  = 5;
}

message FileAccess {
  string path          = 1;
  Access access        = 2;
  bool   sensitive     = 3;
  bool   modified      = 4;
  bool   deleted       = 5;
  bool   renamed       = 6;
  bool   perm_changed  = 7;
  bool   owner_changed = 8;
  bool   is_symlink    = 9;
  bool   denied        = 10;
  bool   audited       = 11;
}

message ConnectionAccess {
  string          addr     = 1;
  uint32          port     = 2;
  Access          access   = 3;
  bool            external = 4;
  optional string hostname = 5;
  optional string country  = 6;
  optional string city     = 7;
  optional string asn      = 8;
}

message UnixSocketAccess {
  string path   = 1;
  Access access = 2;
}

message AgentDetail {
  uint32                    root_pid     = 1;
  string                    root_comm    = 2;
  uint64                    version      = 3;
  repeated ProcessInfo      processes    = 4;
  repeated FileAccess       files        = 5;
  repeated ConnectionAccess connections  = 6;
  repeated ConnectionAccess binds        = 7;
  repeated UnixSocketAccess unix_sockets = 8;
  AgentSummary              summary      = 9;
}

// ---------------------------------------------------------------------------
// Policy
// ---------------------------------------------------------------------------

message PolicySnapshot {
  bool            enforce         = 1;
  repeated string deny_file_paths = 2;
}

message GetPolicyRequest {}

message UpdateDenyRulesRequest {
  repeated string add_deny_file_paths    = 1;
  repeated string remove_deny_file_paths = 2;
}

message SetEnforceRequest {
  bool enforce = 1;
}
